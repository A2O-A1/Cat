<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>主页</title>
<style>
:root{
  --bg:#FAF6F0; --card:rgba(255,255,255,.6); --ink:#3D3833; --ink2:#9C9187;
  --accent:#E8784A; --line:#EDE6DD; --shadow:0 6px 24px rgba(61,56,51,.08);
  --ease:cubic-bezier(.32,.72,0,1);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
}
html[data-theme=dark]{
  --bg:#1C1917; --card:rgba(42,37,33,.72); --ink:#EDE6DD; --ink2:#8A8078;
  --accent:#F08A5C; --line:#3A342E; --shadow:0 6px 24px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--sans); background:var(--bg); color:var(--ink);
  min-height:100svh; display:flex; flex-direction:column; align-items:center;
  padding:max(7svh,44px) 22px calc(24px + env(safe-area-inset-bottom));
  transition:background .3s,color .3s; overflow-x:hidden;
  user-select:none;-webkit-user-select:none;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(120% 60% at 50% -10%,rgba(232,120,74,.06),transparent 60%);
}
main{width:100%;max-width:430px;display:flex;flex-direction:column;align-items:center}

.rise{opacity:0;transform:translateY(12px);animation:rise .5s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}

#clock{font-size:64px;font-weight:200;letter-spacing:.02em;line-height:1;font-variant-numeric:tabular-nums}
#clock .colon{color:var(--accent);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
#clock.flip{animation:flip .2s ease-out;opacity:1;transform:none}
@keyframes flip{50%{opacity:.4;transform:translateY(3px)}}
#date{margin-top:12px;font-size:14px;color:var(--ink2)}
#lunar{margin-top:6px;font-size:13px;color:var(--ink2);font-family:var(--serif);letter-spacing:.06em}
#term{margin-top:4px;font-size:12px;color:var(--accent);font-family:var(--serif);opacity:.85}

#quote{
  margin:30px 0 26px;font-family:var(--serif);font-size:14px;color:var(--ink2);
  text-align:center;line-height:1.9;max-width:300px;cursor:pointer;
  transition:opacity .3s,transform .3s;
}
#quote.out{opacity:0;transform:translateY(8px)}
#quote.in{animation:qin .3s var(--ease)}
@keyframes qin{from{opacity:0;transform:translateY(-8px)}}

#searchBox{
  width:100%;display:flex;align-items:center;gap:8px;
  background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:999px;padding:12px 18px;
  box-shadow:var(--shadow);transition:transform .25s var(--ease),box-shadow .25s;
}
#searchBox:focus-within{transform:scale(1.02);box-shadow:0 10px 32px rgba(61,56,51,.14)}
html[data-theme=dark] #searchBox:focus-within{box-shadow:0 10px 32px rgba(0,0,0,.55)}
#engineBtn{
  flex:none;width:26px;height:26px;border:none;border-radius:50%;cursor:pointer;
  background:var(--accent);color:#fff;font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center;opacity:.75;
  transition:opacity .25s,transform .2s var(--ease);
}
#searchBox:focus-within #engineBtn{opacity:1}
#engineBtn.press{transform:scale(.88)}
#q{
  flex:1;border:none;outline:none;background:transparent;color:var(--ink);
  font-size:15px;font-family:var(--sans);min-width:0;
}
#q::placeholder{color:var(--ink2);opacity:.7}

#engineMenu{
  position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:999;
  background:#FFFFFF;
  border:1px solid var(--line);border-radius:14px;
  box-shadow:0 16px 48px rgba(61,56,51,.28);
  padding:6px;display:none;
  isolation:isolate;
}
html[data-theme=dark] #engineMenu{
  background:#2A2521;
  box-shadow:0 16px 48px rgba(0,0,0,.75);
}
#engineMenu.open{display:block;animation:menuIn .25s var(--ease)}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
#engineMenu button{
  display:block;width:100%;text-align:left;border:none;background:none;cursor:pointer;
  padding:10px 14px;border-radius:9px;font-size:14px;color:var(--ink);
  transform-origin:center;
}
#engineMenu button.on{color:var(--accent);font-weight:600}
#engineMenu button:active{background:var(--line)}
@keyframes pop{
  0%  {transform:scale(1)}
  30% {transform:scale(.82)}
  55% {transform:scale(1.15)}
  75% {transform:scale(.95)}
  100%{transform:scale(1)}
}
#engineMenu button.pop{animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
#searchWrap{position:relative;width:100%;z-index:10}

#grid{
  margin-top:8px;margin-bottom:22px;width:100%;
  display:grid;grid-template-columns:repeat(4,1fr);gap:20px 10px;
  min-height:52px;
}
.site{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;position:relative;transition:opacity .3s}
.site .icon{
  width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:600;color:#fff;overflow:hidden;
  transition:transform .25s var(--ease);background:transparent;box-shadow:none;
}
.site .icon img{width:44px;height:44px;object-fit:contain;border-radius:10px;display:block}
.site .icon .letter{
  width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:600;color:#fff;
}
.site .name{font-size:11px;color:var(--ink2);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site.press .icon{transform:scale(.92)}
body.editing .site .icon{animation:wiggle .3s ease-in-out infinite alternate}
@keyframes wiggle{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.site .del,.site .edit{
  position:absolute;top:-5px;width:18px;height:18px;border-radius:50%;
  background:#8A8078;color:#fff;font-size:12px;line-height:18px;text-align:center;display:none;z-index:2;
}
.site .del{left:calc(50% + 8px)}
.site .edit{right:calc(50% + 8px);font-size:10px}
body.editing .site .del,body.editing .site .edit{display:block}
#grid.dragging .site{transition:none}
.site.ghost{opacity:.35}

#gear{
  position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));
  width:36px;height:36px;border-radius:50%;border:none;background:transparent;
  color:var(--ink2);font-size:17px;cursor:pointer;opacity:.45;transition:opacity .25s,transform .25s;
}
#gear:hover,#gear:active{opacity:1;transform:rotate(30deg)}
#panel{
  position:fixed;inset:0;z-index:50;background:var(--bg);
  padding:60px 26px 40px;display:none;flex-direction:column;gap:6px;overflow-y:auto;
}
#panel.open{display:flex;animation:rise .35s var(--ease)}
#panel h2{font-size:17px;font-weight:600;margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line);font-size:14px}
.row select{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:8px;padding:5px 10px;font-size:13px;outline:none;
}
.sw{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(18px)}
#panel .btns{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
#panel .btns button{
  flex:1;min-width:90px;padding:11px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;
}
#panel .btns button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#closePanel{position:absolute;top:18px;right:22px;border:none;background:none;font-size:22px;color:var(--ink2);cursor:pointer}

#modal{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:none;
  align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
#modal.open{display:flex}
#modal .card{
  width:100%;max-width:360px;background:var(--bg);border-radius:18px;padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);animation:rise .3s var(--ease);
  margin:auto;
}
#modal h3{font-size:16px;margin-bottom:14px;font-weight:600}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--ink2);margin-bottom:6px}
.field input{
  width:100%;padding:11px 14px;border-radius:10px;font-size:14px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none;
}
.field input:focus{border-color:var(--accent)}

/* 自动识别区 */
#autoRow{display:flex;gap:8px;margin-bottom:8px}
#autoRow .fetchBtn{
  flex:1;padding:11px;border-radius:10px;font-size:13px;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:500;
}
#autoRow .fetchBtn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
#autoRow .fetchBtn:disabled{opacity:.5;cursor:default}
#iconStatus{font-size:12px;color:var(--ink2);margin-bottom:8px;line-height:1.5;min-height:16px}
#iconStatus.ok{color:var(--accent)}
#iconStatus.err{color:#C25774}

#candidates{
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
  margin-bottom:10px;
}
#candidates:empty{display:none}
.cand{
  aspect-ratio:1;border-radius:12px;background:var(--card);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;
  transition:transform .15s var(--ease),border-color .2s;padding:5px;position:relative;
}
.cand:active{transform:scale(.9)}
.cand.sel{border-color:var(--accent);background:rgba(232,120,74,.1)}
.cand.sel::after{
  content:"✓";position:absolute;top:-2px;right:-2px;width:16px;height:16px;
  background:var(--accent);color:#fff;border-radius:50%;font-size:11px;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.cand img{width:100%;height:100%;object-fit:contain}

#iconPreviewRow{display:flex;gap:10px;align-items:center}
#currentIcon{
  width:56px;height:56px;border-radius:14px;background:var(--line);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-size:11px;color:var(--ink2);flex:none;border:2px solid transparent;
}
#currentIcon.has{border-color:var(--accent)}
#currentIcon img{width:100%;height:100%;object-fit:contain}
#btnClearIcon{
  padding:8px 14px;border-radius:10px;font-size:12px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink2);
}

#modal .mbtns{display:flex;gap:10px;margin-top:8px}
#modal .mbtns button{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;cursor:pointer;font-weight:500}
#mCancel{background:var(--line);color:var(--ink)}
#mOk{background:var(--accent);color:#fff}

#toast{
  position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:13px;
  opacity:0;transition:all .3s var(--ease);pointer-events:none;z-index:9999;white-space:nowrap;
  max-width:88vw;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:.92;transform:translateX(-50%)}
@media (min-width:520px){#clock{font-size:72px}}
</style>
</head>
<body>
<main>
  <div id="clock" class="rise" style="animation-delay:.02s"></div>
  <div id="date" class="rise" style="animation-delay:.1s"></div>
  <div id="lunar" class="rise" style="animation-delay:.16s"></div>
  <div id="term" class="rise" style="animation-delay:.2s"></div>
  <div id="quote" class="rise" style="animation-delay:.28s" title="点击换一条"></div>
  <div id="grid" class="rise" style="animation-delay:.34s"></div>
  <div id="searchWrap" class="rise" style="animation-delay:.42s">
    <form id="searchBox" autocomplete="off">
      <button type="button" id="engineBtn" title="切换搜索引擎"></button>
      <input id="q" type="search" placeholder="搜索…" enterkeyhint="search">
    </form>
    <div id="engineMenu"></div>
  </div>
</main>

<button id="gear" title="设置">⚙</button>
<div id="panel">
  <button id="closePanel">×</button>
  <h2>设置</h2>
  <div class="row"><span>默认搜索引擎</span><select id="selEngine"></select></div>
  <div class="row"><span>深色模式</span><select id="selTheme">
    <option value="auto">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option>
  </select></div>
  <div class="row"><span>显示秒</span><div class="sw" id="swSec"></div></div>
  <div class="row"><span>显示农历</span><div class="sw" id="swLunar"></div></div>
  <div class="row"><span>节气提示</span><div class="sw" id="swTerm"></div></div>
  <div class="row"><span>一言在线更新</span><div class="sw" id="swQuote"></div></div>
  <div class="btns">
    <button id="btnAddSite" class="primary">添加书签</button>
    <button id="btnExport">导出数据</button>
    <button id="btnImport">导入数据</button>
    <button id="btnReset">恢复默认</button>
  </div>
  <input type="file" id="fileImp" accept=".json" hidden>
</div>

<div id="modal">
  <div class="card">
    <h3 id="modalTitle">添加收藏</h3>

    <div class="field">
      <label>名称</label>
      <input id="mName" placeholder="如 GitHub" maxlength="12">
    </div>

    <div class="field">
      <label>网址</label>
      <input id="mUrl" placeholder="https://example.com" inputmode="url">
    </div>

    <div class="field">
      <label>网站图标</label>
      <div id="autoRow">
        <button id="btnFetch" type="button" class="fetchBtn">🔍 自动识别网站图标</button>
        <button id="btnLocal" type="button" class="fetchBtn ghost">🖼 本地图片</button>
      </div>
      <div id="iconStatus">输入网址后点「自动识别」，会抓取多个图标供选择</div>
      <div id="candidates"></div>
      <div id="iconPreviewRow">
        <div id="currentIcon">无图</div>
        <button id="btnClearIcon" type="button">清除</button>
      </div>
      <input type="file" id="localImg" accept="image/*" hidden>
    </div>

    <div class="mbtns"><button id="mCancel">取消</button><button id="mOk">保存</button></div>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
/* ============ 农历 ============ */
const LUNAR_INFO=[0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,

0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,

0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,

0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,

0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a4d0,0x0d150,0x0f252,
0x0d520];
const GAN="甲乙丙丁戊己庚辛壬癸",ZHI="子丑寅卯辰巳午未申酉戌亥",ZODIAC="鼠牛虎兔龙蛇马羊猴鸡狗猪";
const LMONTH="正二三四五六七八九十冬腊",LDAY2="一二三四五六七八九十";
const TERMS=["小寒","大寒","立春","雨水","惊蛰","春分","清明","谷雨","立夏","小满","芒种","夏至","小暑","大暑","立秋","处暑","白露","秋分","寒露","霜降","立冬","小雪","大雪","冬至"];
const TERM_DAYS=[[6,20],[4,19],[6,18],[5,20],[6,21],[5,20],[6,21],[5,21],[6,21],[5,21],[6,22],[7,23],[7,22],[8,23],[8,23],[7,23],[8,22],[7,22],[6,21],[7,22],[7,21],[6,21]];
function leapMonth(y){return LUNAR_INFO[y-1900]&0xf}
function leapDays(y){return leapMonth(y)?((LUNAR_INFO[y-1900]&0x10000)?30:29):0}
function monthDays(y,m){return (LUNAR_INFO[y-1900]&(0x10000>>m))?30:29}
function lunarYearDays(y){let s=0;for(let m=1;m<=12;m++)s+=monthDays(y,m);return s+leapDays(y)}
function getLunar(d){
  let off=Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1900,0,31))/864e5);
  let y=1900,ty;
  for(;y<2101;y++){ty=lunarYearDays(y);if(off<ty)break;off-=ty}
  let lm=leapMonth(y),m=1,isLeap=false,md;
  for(;m<=12;m++){
    if(lm&&m===lm+1&&!isLeap){m--;isLeap=true;md=leapDays(y)}else md=monthDays(y,m);
    if(off<md)break;off-=md;
    if(isLeap&&m===lm)isLeap=false;
  }
  const gz=GAN[(y-4)%10]+ZHI[(y-4)%12],z=ZODIAC[(y-4)%12];
  const mStr=isLeap?"闰"+LMONTH[m-1]+"月":LMONTH[m-1]+"月";
  const dd=off+1;
  const dayStr=dd===1?"初一":dd<=10?"初"+LDAY2[dd-1]:dd<20?"十"+LDAY2[dd-11]:dd===20?"二十":dd<30?"廿"+LDAY2[dd-21]:dd===30?"三十":"卅"+LDAY2[dd-31];
  return {y,m,dd,isLeap,text:mStr+dayStr,gzYear:gz+z+"年"};
}
function nextTerm(now){
  for(let i=0;i<24;i++){
    const mo=Math.floor(i/2),d=TERM_DAYS[mo][i%2];
    let t=new Date(now.getFullYear(),mo,d);
    if(t>=new Date(now.getFullYear(),now.getMonth(),now.getDate())){
      return {name:TERMS[i],days:Math.ceil((t-now)/864e5)};
    }
  }
  const t=new Date(now.getFullYear()+1,0,TERM_DAYS[0][0]);
  return {name:"小寒",days:Math.ceil((t-now)/864e5)};
}

function bindLongPress(){
  grid.querySelectorAll(".site").forEach(el=>{
    let t=null,sx=0,sy=0,dragging=false;
    const start=(x,y)=>{
      sx=x;sy=y;dragging=false;
      t=setTimeout(()=>{
        t=null;
        if(!document.body.classList.contains("editing")){
          document.body.classList.add("editing");toast("编辑模式 · 点空白处完成");
          navigator.vibrate&&navigator.vibrate(10);
        }else dragging=true;
        grid.classList.add("dragging");
      },500);
    };
    const move=(x,y)=>{
      if(t&&Math.hypot(x-sx,y-sy)>10){clearTimeout(t);t=null}
      if(dragging){
        grid.classList.add("dragging");
        el.style.position="relative";el.style.zIndex=10;
        el.style.transform="translate("+(x-sx)+"px,"+(y-sy)+"px) scale(1.08)";
        const under=document.elementFromPoint(x,y)?.closest(".site");
        if(under&&under!==el){
          const from=+el.dataset.i,to=+under.dataset.i;
          if(from!==to){const [m]=sites.splice(from,1);sites.splice(to,0,m);
            if(from<to)grid.insertBefore(el,under.nextSibling);else grid.insertBefore(el,under);
            grid.querySelectorAll(".site").forEach((a,idx)=>a.dataset.i=idx);
          }
        }
      }
    };
    const end=()=>{
      if(t){clearTimeout(t);t=null}
      if(dragging){
        dragging=false;grid.classList.remove("dragging");
        el.style.transform="";el.style.zIndex="";el.style.position="";
        saveSites();
      }
      grid.classList.remove("dragging");
    };
    el.addEventListener("pointerdown",e=>{start(e.clientX,e.clientY)});
    el.addEventListener("pointermove",e=>move(e.clientX,e.clientY));
    el.addEventListener("pointerup",end);
    el.addEventListener("pointercancel",end);
    el.addEventListener("pointerleave",()=>{if(t){clearTimeout(t);t=null}});
    el.addEventListener("touchstart",()=>el.classList.add("press"),{passive:true});
    el.addEventListener("touchend",()=>setTimeout(()=>el.classList.remove("press"),150));
  });
}

/* URL → Base64 */
function urlToBase64(url){
  return new Promise(resolve=>{
    let done=false;
    const finish=(v)=>{if(!done){done=true;resolve(v)}};
    const timer=setTimeout(()=>finish(null),5000);
    try{
      const img=new Image();
      img.crossOrigin="anonymous";
      img.onload=()=>{
        try{
          const c=document.createElement("canvas");
          c.width=img.naturalWidth||64;c.height=img.naturalHeight||64;
          const ctx=c.getContext("2d");ctx.drawImage(img,0,0);
          const d=c.toDataURL("image/png");
          clearTimeout(timer);finish(d);
        }catch(e){clearTimeout(timer);finish(null)}
      };
      img.onerror=()=>{clearTimeout(timer);finish(null)};
      img.src=url;
    }catch(e){clearTimeout(timer);finish(null)}
  });
}
/* 多源抓取候选图标 */
function fetchCandidates(url){
  return new Promise(resolve=>{
    let host,origin;
    try{const u=new URL(url);host=u.hostname;origin=u.origin}catch(e){resolve([]);return}
    const list=[
      origin+"/apple-touch-icon.png",
      origin+"/apple-touch-icon-precomposed.png",
      "https://www.google.com/s2/favicons?domain="+host+"&sz=128",
      "https://icons.duckduckgo.com/ip3/"+host+".ico",
      origin+"/favicon.svg",
      origin+"/icon.svg",
      origin+"/favicon.png",
      origin+"/favicon.ico"
    ];
    (async ()=>{
      const ok=[];
      for(const u of list){
        const b64=await urlToBase64(u);
        if(b64 && !ok.includes(b64))ok.push(b64);
      }
      resolve(ok);
    })();
  });
}

};
const fileImp=document.getElementById("fileImp");
document.getElementById("btnImport").onclick=()=>fileImp.click();
fileImp.onchange=()=>{
  const f=fileImp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result);
    if(j.settings){settings=Object.assign({},DEFAULTS,j.settings);delete settings.sites;saveSettings()}
    if(Array.isArray(j.sites)){sites=j.sites;saveSites()}
    applyTheme();renderEngine();buildEngineMenu();renderGrid();tick();syncPanel();loadQuote();
    toast("导入成功");
  }catch(e){toast("文件格式不对")}};
  r.readAsText(f);fileImp.value="";
};
document.getElementById("btnReset").onclick=()=>{
  localStorage.removeItem("bh.settings");localStorage.removeItem("bh.sites");localStorage.removeItem("bh.icons");
  loadState();applyTheme();renderEngine();buildEngineMenu();renderGrid();tick();syncPanel();loadQuote();
  toast("已恢复默认");
};

/* ============ Toast ============ */
let toastTimer=null;
function toast(msg){
  const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ============ 启动 ============ */
loadState();applyTheme();renderEngine();buildEngineMenu();renderGrid();tick();
setInterval(tick,1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});
loadQuote();
</script>
</body>
</html>
